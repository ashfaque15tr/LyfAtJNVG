name: JNV Alumni CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  verify-and-test:
    name: Automated Verification & Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Platform Test Suite
        run: |
          node tests/comprehensive_test_suite.js

  deploy-github-pages:
    name: Deploy Production Web Portal (GitHub Pages)
    needs: verify-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android-apk:
    name: Build Android Native APK
    needs: verify-and-test
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: |
          npm install

      - name: Setup Android SDK Platform 36 & Accept Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b816f454d0d\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Prepare Android Web Assets
        run: |
          chmod +x android/gradlew
          node scripts/prepare-www.js

      - name: Compile Android APK & Google Play Bundle (.aab) with Gradle
        run: |
          cd android
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace > ../gradle_build.log 2>&1

      - name: Capture Gradle Build Error if Failed
        if: failure()
        run: |
          tail -n 80 gradle_build.log > gradle_last_error.txt
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add gradle_last_error.txt
          git commit -m "build-debug: report gradle build failure details" || true
          git push || true

      - name: Upload Gradle Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log

      - name: Upload Native Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JNV_Alumni_Android_APK_v0.0.1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Google Play Store Bundle (.aab) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JNV_Alumni_Google_Play_Bundle_v0.0.1
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish Android APK & Play Store Bundle to GitHub Release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk JNV_Alumni_v0.0.1.apk
          cp android/app/build/outputs/bundle/release/app-release.aab JNV_Alumni_PlayStore_v0.0.1.aab
          gh release delete v0.0.1 --yes || true
          git tag -d v0.0.1 || true
          git push origin :refs/tags/v0.0.1 || true
          gh release create v0.0.1 JNV_Alumni_v0.0.1.apk JNV_Alumni_PlayStore_v0.0.1.aab \
            --title "JNV Alumni Platform v0.0.1 - Android App & Play Store Bundle" \
            --notes "Official installable Android APK (v0.0.1) and Google Play Store App Bundle (.aab) for JNV Alumni Platform (Gauriganj, Amethi). Upload the .aab file directly to Google Play Console."

  build-mobile-bundle:
    name: Package Mobile App Distribution
    needs: verify-and-test
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Package Mobile App Distribution Archive
        run: |
          cd mobile_app
          zip -r ../JNV_Alumni_Mobile_App_Bundle.zip . -x "*.DS_Store*"

      - name: Upload Store Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JNV_Alumni_Mobile_App_Bundle
          path: JNV_Alumni_Mobile_App_Bundle.zip
