name: JNV Alumni CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  verify-and-test:
    name: Automated Verification & Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Platform Test Suite
        run: |
          node tests/comprehensive_test_suite.js

  deploy-github-pages:
    name: Deploy Production Web Portal (GitHub Pages)
    needs: verify-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android-apk:
    name: Build Android Native APK
    needs: verify-and-test
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: |
          npm install

      - name: Prepare Android Web Assets
        run: |
          chmod +x android/gradlew
          node scripts/prepare-www.js

      - name: Compile Native Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace > ../gradle_build.log 2>&1

      - name: Capture Gradle Build Error if Failed
        if: failure()
        run: |
          tail -n 80 gradle_build.log > gradle_last_error.txt
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add gradle_last_error.txt
          git commit -m "build-debug: report gradle build failure details" || true
          git push || true

      - name: Upload Gradle Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log

      - name: Upload Native Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JNV_Alumni_Android_APK_v0.0.1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-mobile-bundle:
    name: Package Mobile App Distribution
    needs: verify-and-test
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Package Mobile App Distribution Archive
        run: |
          cd mobile_app
          zip -r ../JNV_Alumni_Mobile_App_Bundle.zip . -x "*.DS_Store*"

      - name: Upload Store Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JNV_Alumni_Mobile_App_Bundle
          path: JNV_Alumni_Mobile_App_Bundle.zip
